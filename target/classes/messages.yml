prefix: "&#33A2FF&lE&#29ACFF&lS&#1EB6FF&lD&#14BFFF&lu&#0AC9FF&le&#00D3FF&ll&#00E5FF&ls&r &8▶ "

general:
  no-permission: "{PREFIX}&cYou do not have permission to execute this command."
  player-only: "{PREFIX}&cThis command can only be executed by players."
  player-not-found: "{PREFIX}&cPlayer &e{PLAYER} &cnot found or is offline."
  reload-success: "{PREFIX}&aConfigurations and arenas reloaded successfully!"

queue:
  joined: "{PREFIX}&aYou joined the duels queue! Searching for an opponent..."
